name: colabroom
description: Music-first collaborative rooms for Apple, Android, and web.
publish_to: none
version: 0.5.1+12

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # How a link reaches the app on an iPhone (see IncomingAddresses). Already
  # in every build as supabase_flutter's own dependency; named here because
  # this code now uses it directly. Pinned to the version already resolved.
  app_links: 7.2.1
  audioplayers: ^6.8.1
  barcode: ^2.2.9
  archive: ^4.0.9
  audio_decoder: ^0.8.1
  cross_file: 0.3.5+4
  # Push. firebase_core is only here because firebase_messaging needs a
  # configured app to attach to; nothing else in this project uses Firebase,
  # and Analytics/Crashlytics are deliberately not installed.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  csv: 6.0.0
  fftea: ^1.5.0+1
  file_picker: 12.0.0
  google_fonts: ^6.2.1
  http: 1.6.0
  path_provider: 2.1.5
  pdf_document: 3.5.1
  pdf_graphics: 3.2.0
  record: 6.2.1
  pdf: ^3.13.0
  printing: 5.15.0
  share_plus: ^13.3.0
  shared_preferences: ^2.3.0
  speech_to_text: ^7.0.0
  supabase_flutter: ^2.0.0
  # Opens showcase links in the browser or the platform's own app. Nothing
  # else in this project leaves the app, and nothing here uses a custom
  # scheme — https only, which is also all the link allowlist admits.
  url_launcher: ^6.3.1
  xml: ^7.0.1
  flutter_local_notifications: ^22.3.0
  livekit_client: 2.13.0
  # The only thing in this app that says anything out loud. Perform calls the
  # next chord one beat before it lands, for a player whose eyes are on their
  # instrument or who cannot see the chart at all (Every Musician, Same Song,
  # 17 September 2026, "feel the beat, hear the chords coming"). Pinned rather
  # than ranged because it is a platform plugin and how a voice queues is the
  # kind of thing a minor bump changes; a test speaks through ChordVoice
  # instead, and never through this.
  #
  # It speaks on the web through the browser's own speech synthesis, and
  # `flutter build web` — what build-web.yml ships — builds with it, so the
  # desk keeps its voice. Its web file does trip the WebAssembly dry run's
  # interop lint, which is a warning today and would be a wall the day this
  # app is built with --wasm: something to settle then, not a reason to leave
  # a blind player at the desk without the calls now.
  flutter_tts: 4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

# Pinned, not chosen.
#
# pubspec.lock is not committed, so CI resolves every dependency fresh on
# every run. On 15 Sep 2026 objective_c 9.6.1 was published between one CI
# run and the next, and its build hook references `Architecture.arm64e`,
# which the Dart in Flutter stable does not have yet -- so every job that
# runs `flutter pub get` failed at "Building native assets", on a change
# that touched nothing near it. Nothing in this app uses objective_c
# directly; it arrives through a transitive dependency. Held at the last
# version that builds until Flutter stable catches up, at which point this
# block can go.
dependency_overrides:
  objective_c: 9.6.0

flutter:
  uses-material-design: true
