name: colabroom
description: Music-first collaborative rooms for Apple, Android, and web.
publish_to: none
version: 0.3.1+7

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  archive: ^4.0.9
  audio_decoder: ^0.8.1
  cross_file: 0.3.5+4
  # Push. firebase_core is only here because firebase_messaging needs a
  # configured app to attach to; nothing else in this project uses Firebase,
  # and Analytics/Crashlytics are deliberately not installed.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  csv: 6.0.0
  fftea: ^1.5.0+1
  file_picker: 12.0.0
  google_fonts: ^6.2.1
  http: 1.6.0
  path_provider: 2.1.5
  pdf_document: 3.5.1
  pdf_graphics: 3.2.0
  record: 6.2.1
  pdf: ^3.13.0
  printing: 5.15.0
  share_plus: ^13.3.0
  shared_preferences: ^2.3.0
  speech_to_text: ^7.0.0
  supabase_flutter: ^2.0.0
  # Opens showcase links in the browser or the platform's own app. Nothing
  # else in this project leaves the app, and nothing here uses a custom
  # scheme — https only, which is also all the link allowlist admits.
  url_launcher: ^6.3.1
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
