name: Build iOS and upload to TestFlight

# Manual only — every run does a real signed build and uploads it to
# TestFlight, so this shouldn't fire on every push the way the Android
# build does (that would spam TestFlight with a build per commit, and
# macos-latest runners cost more Actions minutes than the Linux one
# Android uses).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    # match (see the Fastfile below) stores the encrypted signing cert on a
    # branch of this same repo, so it needs push access.
    permissions:
      contents: write
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MATCH_GIT_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Mirrors the Android workflow's "scaffold if missing" pattern. If a
      # real ios/ folder gets committed later (e.g. generated locally on a
      # Mac), that takes precedence and this step no-ops.
      - name: Scaffold iOS platform folder if missing
        run: |
          if [ ! -d ios ]; then
            echo "No ios/ folder found — scaffolding one."
            flutter create --platforms=ios --org com.colabroom --project-name colabroom .

            PBXPROJ=ios/Runner.xcodeproj/project.pbxproj
            # Match Android's applicationId (com.colabroom.beta) rather than
            # the org/project-name default (com.colabroom.colabroom) — the
            # Supabase auth redirect URL is hardcoded to this scheme in
            # lib/app/beta_config.dart, so it must match exactly.
            sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com\.colabroom\.colabroom;/PRODUCT_BUNDLE_IDENTIFIER = com.colabroom.beta;/g' "$PBXPROJ"
            grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.colabroom.beta;' "$PBXPROJ" || { echo "::error::Bundle identifier patch did not apply"; exit 1; }

            PLIST=ios/Runner/Info.plist
            # record + speech_to_text both need explicit usage descriptions
            # on iOS or the app crashes the instant either is used — Android
            # only needs a manifest permission, so this has no Android
            # equivalent to mirror.
            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'CoLabRoom needs the microphone to record song ideas and voice notes.'" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'CoLabRoom uses speech recognition to turn your voice into lyrics.'" "$PLIST"
            # Registers the com.colabroom.beta:// URL scheme so Supabase's
            # auth redirect can hand control back to the app after sign-in.
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.colabroom.beta" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.colabroom.beta" "$PLIST"

            # CoLabRoom only ever talks to Supabase over plain HTTPS/TLS —
            # no custom encryption — so it qualifies for Apple's standard
            # exemption. Declaring that up front here means every future
            # TestFlight build skips the "Missing Compliance" prompt
            # App Store Connect otherwise shows for every single upload.
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"

            # flutter create only ships Flutter's generic placeholder app
            # icon — the real one (assets/icon/launcher_icon.svg, the same
            # source the Android build rasterizes via
            # scripts/generate_launcher_icons.sh) never had an iOS
            # counterpart, so every TestFlight build shipped the wrong
            # icon. Regenerate the full AppIcon.appiconset from that same
            # source instead of trusting the scaffolded placeholder.
            brew install librsvg
            ICONSET=ios/Runner/Assets.xcassets/AppIcon.appiconset
            rm -rf "$ICONSET"
            mkdir -p "$ICONSET"
            for size in 20 29 40 58 60 76 80 87 120 152 167 180 1024; do
              rsvg-convert -w "$size" -h "$size" assets/icon/launcher_icon.svg -o "$ICONSET/icon-$size.png"
            done
            cat > "$ICONSET/Contents.json" <<'ICONEOF'
            {
              "images" : [
                { "idiom" : "iphone", "scale" : "2x", "size" : "20x20", "filename" : "icon-40.png" },
                { "idiom" : "iphone", "scale" : "3x", "size" : "20x20", "filename" : "icon-60.png" },
                { "idiom" : "iphone", "scale" : "2x", "size" : "29x29", "filename" : "icon-58.png" },
                { "idiom" : "iphone", "scale" : "3x", "size" : "29x29", "filename" : "icon-87.png" },
                { "idiom" : "iphone", "scale" : "2x", "size" : "40x40", "filename" : "icon-80.png" },
                { "idiom" : "iphone", "scale" : "3x", "size" : "40x40", "filename" : "icon-120.png" },
                { "idiom" : "iphone", "scale" : "2x", "size" : "60x60", "filename" : "icon-120.png" },
                { "idiom" : "iphone", "scale" : "3x", "size" : "60x60", "filename" : "icon-180.png" },
                { "idiom" : "ipad", "scale" : "1x", "size" : "20x20", "filename" : "icon-20.png" },
                { "idiom" : "ipad", "scale" : "2x", "size" : "20x20", "filename" : "icon-40.png" },
                { "idiom" : "ipad", "scale" : "1x", "size" : "29x29", "filename" : "icon-29.png" },
                { "idiom" : "ipad", "scale" : "2x", "size" : "29x29", "filename" : "icon-58.png" },
                { "idiom" : "ipad", "scale" : "1x", "size" : "40x40", "filename" : "icon-40.png" },
                { "idiom" : "ipad", "scale" : "2x", "size" : "40x40", "filename" : "icon-80.png" },
                { "idiom" : "ipad", "scale" : "1x", "size" : "76x76", "filename" : "icon-76.png" },
                { "idiom" : "ipad", "scale" : "2x", "size" : "76x76", "filename" : "icon-152.png" },
                { "idiom" : "ipad", "scale" : "2x", "size" : "83.5x83.5", "filename" : "icon-167.png" },
                { "idiom" : "ios-marketing", "scale" : "1x", "size" : "1024x1024", "filename" : "icon-1024.png" }
              ],
              "info" : { "author" : "xcode", "version" : 1 }
            }
            ICONEOF
          else
            echo "ios/ folder already present, using it as-is."
          fi

      - run: flutter pub get

      # flutter create doesn't ship a static ios/Podfile — Flutter generates
      # it lazily during an actual build step (and runs `pod install` as
      # part of that), not from `flutter pub get` alone. This unsigned
      # build is the same one the earlier validation run already proved
      # works; fastlane's build_app below does the real signed archive.
      - name: Generate Podfile and prime the iOS build
        run: flutter build ios --release --no-codesign

      # Written fresh every run rather than committed — keeps the signing
      # pipeline entirely inside this workflow file, matching how the
      # scaffold step above isn't committed either.
      #
      # Several rounds of automatic-signing flag combinations (xcargs
      # DEVELOPMENT_TEAM/CODE_SIGN_STYLE/CODE_SIGN_IDENTITY overrides) kept
      # producing new conflicts, so signing moved to explicit manual mode
      # (update_code_signing_settings, Runner target only).
      #
      # Manual signing still needs a real cert+profile from somewhere. The
      # first attempt used `cert`/`sigh`, which mint a brand new Apple
      # Distribution certificate every run — but each GitHub-hosted runner
      # is thrown away afterward, so nothing ever gets reused, and Apple
      # caps how many active Distribution certs an account can have. Two
      # throwaway runs were enough to hit that cap outright ("reached the
      # maximum number of available Distribution certificates"), which
      # would recur on every single future run under that design, not just
      # this one. `match` fixes the actual problem: it generates the
      # cert+profile once, encrypts them with MATCH_PASSWORD, and pushes
      # them to a branch of this repo — every run after the first just
      # downloads and reuses that same pair instead of minting a new one.
      - name: Write Fastfile
        run: |
          mkdir -p ios/fastlane
          cat > ios/fastlane/Fastfile <<'EOF'
          default_platform(:ios)

          platform :ios do
            desc "Build and upload a TestFlight beta build"
            lane :beta do
              # Also used by match below as the keychain to import the
              # cert+key into (it defaults to whichever keychain setup_ci
              # just made the system default, so no explicit keychain_path
              # is needed here — that was the pitfall with the old `cert`
              # action).
              setup_ci

              api_key = app_store_connect_api_key(
                key_id: ENV["APPLE_API_KEY_ID"],
                issuer_id: ENV["APPLE_API_ISSUER_ID"],
                key_content: ENV["APPLE_API_KEY_P8"],
                is_key_content_base64: false
              )

              match(
                type: "appstore",
                api_key: api_key,
                app_identifier: "com.colabroom.beta",
                team_id: ENV["APPLE_TEAM_ID"],
                storage_mode: "git",
                git_url: "https://x-access-token:#{ENV['MATCH_GIT_TOKEN']}@github.com/#{ENV['MATCH_GIT_REPOSITORY']}.git",
                git_branch: "ios-signing-certs",
                readonly: false
              )

              update_code_signing_settings(
                use_automatic_signing: false,
                path: "Runner.xcodeproj",
                targets: ["Runner"],
                team_id: ENV["APPLE_TEAM_ID"],
                code_sign_identity: "Apple Distribution",
                profile_name: lane_context[SharedValues::MATCH_PROVISIONING_PROFILE_MAPPING]["com.colabroom.beta"]
              )

              build_app(
                workspace: "Runner.xcworkspace",
                scheme: "Runner",
                export_method: "app-store",
                output_directory: "build",
                output_name: "Runner.ipa"
              )

              upload_to_testflight(
                api_key: api_key,
                app_identifier: "com.colabroom.beta",
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOF

      - name: Build and upload to TestFlight
        run: cd ios && gem install fastlane -N && fastlane beta

# ---------------------------------------------------------------------------
# After this succeeds: the build shows up under App Store Connect ->
# TestFlight, usually within a few minutes to ~30 (Apple's own processing
# time, which this job doesn't wait for — skip_waiting_for_build_processing
# is set so the CI job itself finishes promptly). From there:
#   - Internal testers (people on your Apple Developer team, up to 100) get
#     it instantly once processing finishes, no review needed.
#   - External testers need one quick Apple Beta App Review the first time
#     (usually same-day to ~48h), then future builds skip review.
#
# Honest expectation-setting: this is the first real run of a from-scratch
# fastlane + API-key signing pipeline, and there's no way to test it without
# actually running it on GitHub's macOS runner — if it fails, the error in
# the Actions log (usually a signing or CocoaPods issue) is the next thing
# to look at, not a sign anything is fundamentally wrong with the approach.
#
# One-time setup this workflow depends on: a repo secret named
# MATCH_PASSWORD (any passphrase you pick — it's only used to encrypt the
# certificate before match stores it on the ios-signing-certs branch, never
# sent to Apple). GITHUB_TOKEN is provided automatically by Actions, no
# setup needed for that one.
# ---------------------------------------------------------------------------
