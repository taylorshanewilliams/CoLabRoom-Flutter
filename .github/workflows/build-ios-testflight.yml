name: Build iOS and upload to TestFlight

# Manual only — every run does a real signed build and uploads it to
# TestFlight, so this shouldn't fire on every push the way the Android
# build does (that would spam TestFlight with a build per commit, and
# macos-latest runners cost more Actions minutes than the Linux one
# Android uses).
on:
  workflow_dispatch:
    inputs:
      new_signing_profile:
        description: >-
          Make a fresh provisioning profile. Once, after a capability is
          switched on for the App ID (Associated Domains, 16 Sep 2026):
          match otherwise reuses the stored profile, which predates it.
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    # match (see the Fastfile below) stores the encrypted signing cert on a
    # branch of this same repo, so it needs push access.
    permissions:
      contents: write
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MATCH_GIT_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      NEW_SIGNING_PROFILE: ${{ inputs.new_signing_profile }}
      # `xcodebuild -showBuildSettings` against this workspace takes about
      # forty-five seconds, and fastlane waits three, four times, before
      # giving up. That is what failed the 10 September build: signing had
      # already succeeded — "All required keys, certificates and provisioning
      # profiles are installed" — and then the run died on a stopwatch.
      #
      # It got slow because the iOS project resolves thirty Swift packages
      # now (Firebase, gRPC, Abseil, leveldb and the rest), and every one of
      # them is checked out before the settings can be read. That number only
      # goes up, so the timeout is set well past the current cost rather than
      # just past it.
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 180
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 6
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Mirrors the Android workflow's "scaffold if missing" pattern. If a
      # real ios/ folder gets committed later (e.g. generated locally on a
      # Mac), that takes precedence and this step no-ops.
      - name: Scaffold iOS platform folder if missing
        run: |
          if [ ! -d ios ]; then
            echo "No ios/ folder found — scaffolding one."
            flutter create --platforms=ios --org com.colabroom --project-name colabroom .

            PBXPROJ=ios/Runner.xcodeproj/project.pbxproj
            # Match Android's applicationId (com.colabroom.beta) rather than
            # the org/project-name default (com.colabroom.colabroom) — the
            # Supabase auth redirect URL is hardcoded to this scheme in
            # lib/app/beta_config.dart, so it must match exactly.
            sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com\.colabroom\.colabroom;/PRODUCT_BUNDLE_IDENTIFIER = com.colabroom.beta;/g' "$PBXPROJ"
            grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.colabroom.beta;' "$PBXPROJ" || { echo "::error::Bundle identifier patch did not apply"; exit 1; }

            PLIST=ios/Runner/Info.plist
            # PlistBuddy's `Add` fails outright if the key already exists,
            # `Set` fails if it doesn't — which of those is true keeps
            # shifting as Flutter's own `flutter create` template evolves
            # (this broke a real run: a newer template started shipping
            # CFBundleDisplayName by default, where it previously didn't).
            # Try Set first and only Add as a fallback so this keeps working
            # regardless of what a given Flutter version's template
            # happens to pre-populate.
            plist_set() {
              /usr/libexec/PlistBuddy -c "Set $1 $2" "$PLIST" 2>/dev/null \
                || /usr/libexec/PlistBuddy -c "Add $1 $3 $2" "$PLIST"
            }

            # flutter create derives CFBundleName/CFBundleDisplayName from
            # --project-name (lowercase "colabroom"), which is what shows
            # under the icon on the home screen — override both to the
            # properly-cased brand name (matches the Android manifest fix).
            plist_set :CFBundleName CoLabRoom string
            plist_set :CFBundleDisplayName CoLabRoom string
            # record + speech_to_text both need explicit usage descriptions
            # on iOS or the app crashes the instant either is used — Android
            # only needs a manifest permission, so this has no Android
            # equivalent to mirror.
            plist_set :NSMicrophoneUsageDescription "'CoLabRoom needs the microphone to record song ideas and voice notes.'" string
            plist_set :NSSpeechRecognitionUsageDescription "'CoLabRoom uses speech recognition to turn your voice into lyrics.'" string
            # Calls in a room (0134). Asked at the first call, not at launch.
            plist_set :NSCameraUsageDescription "'CoLabRoom uses the camera for video calls with people in your rooms. Calls are never recorded.'" string
            # Without this, a push can be *drawn* by iOS but the app is never
            # woken to see it -- so `onBackgroundMessage` never runs, and the
            # arrival receipt that 0127 exists to collect is never filed. The
            # closed-app half of "did it reach the phone" is unanswerable on
            # iOS until this is here. An array, so Set cannot touch it.
            /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" >/dev/null 2>&1 || {
              /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
            }
            /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" | grep -q "remote-notification" || {
              /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes: string remote-notification" "$PLIST"
            }
            /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" | grep -q "remote-notification" \
              || { echo "::error::remote-notification background mode did not land"; exit 1; }
            # Registers the com.colabroom.beta:// URL scheme so Supabase's
            # auth redirect can hand control back to the app after sign-in.
            # These are structural (array/dict), not scalar values Set can
            # touch, so Add-with-fallback isn't applicable — check for
            # existence directly instead.
            /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST" >/dev/null 2>&1 || {
              /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
              /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
              /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.colabroom.beta" "$PLIST"
              /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
              /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.colabroom.beta" "$PLIST"
            }

            # CoLabRoom only ever talks to Supabase over plain HTTPS/TLS —
            # no custom encryption — so it qualifies for Apple's standard
            # exemption. Declaring that up front here means every future
            # TestFlight build skips the "Missing Compliance" prompt
            # App Store Connect otherwise shows for every single upload.
            plist_set :ITSAppUsesNonExemptEncryption false bool

            # Universal Links reach the app through app_links, not the
            # engine. The engine's own handling waits three seconds for the
            # first frame on a cold start and then sends the link back to
            # Safari; this app waits on Supabase and Firebase before its first
            # frame. See lib/services/incoming_addresses.dart.
            plist_set :FlutterDeepLinkingEnabled false bool

            # flutter create only ships Flutter's generic placeholder app
            # icon — the real one (assets/icon/launcher_icon.svg, the same
            # source the Android build rasterizes via
            # scripts/generate_launcher_icons.sh) never had an iOS
            # counterpart, so every TestFlight build shipped the wrong
            # icon. Regenerate the full AppIcon.appiconset from that same
            # source instead of trusting the scaffolded placeholder.
            brew install librsvg imagemagick
            ICONSET=ios/Runner/Assets.xcassets/AppIcon.appiconset
            rm -rf "$ICONSET"
            mkdir -p "$ICONSET"
            for size in 20 29 40 58 60 76 80 87 120 152 167 180 1024; do
              rsvg-convert -w "$size" -h "$size" assets/icon/launcher_icon.svg -o "$ICONSET/icon-$size.png"
              # The source SVG has rounded corners (correct for Android,
              # which masks the icon itself), leaving the PNG's corners
              # transparent — but Apple requires iOS icons to be a fully
              # opaque square with no alpha channel at all (iOS applies its
              # own rounding). Flatten onto the icon's own navy background
              # so the corners fill in instead of showing as transparent.
              magick "$ICONSET/icon-$size.png" -background '#06101F' -alpha remove -alpha off "$ICONSET/icon-$size.png"
            done
            printf '%s' '{"images":[{"idiom":"iphone","scale":"2x","size":"20x20","filename":"icon-40.png"},{"idiom":"iphone","scale":"3x","size":"20x20","filename":"icon-60.png"},{"idiom":"iphone","scale":"2x","size":"29x29","filename":"icon-58.png"},{"idiom":"iphone","scale":"3x","size":"29x29","filename":"icon-87.png"},{"idiom":"iphone","scale":"2x","size":"40x40","filename":"icon-80.png"},{"idiom":"iphone","scale":"3x","size":"40x40","filename":"icon-120.png"},{"idiom":"iphone","scale":"2x","size":"60x60","filename":"icon-120.png"},{"idiom":"iphone","scale":"3x","size":"60x60","filename":"icon-180.png"},{"idiom":"ipad","scale":"1x","size":"20x20","filename":"icon-20.png"},{"idiom":"ipad","scale":"2x","size":"20x20","filename":"icon-40.png"},{"idiom":"ipad","scale":"1x","size":"29x29","filename":"icon-29.png"},{"idiom":"ipad","scale":"2x","size":"29x29","filename":"icon-58.png"},{"idiom":"ipad","scale":"1x","size":"40x40","filename":"icon-40.png"},{"idiom":"ipad","scale":"2x","size":"40x40","filename":"icon-80.png"},{"idiom":"ipad","scale":"1x","size":"76x76","filename":"icon-76.png"},{"idiom":"ipad","scale":"2x","size":"76x76","filename":"icon-152.png"},{"idiom":"ipad","scale":"2x","size":"83.5x83.5","filename":"icon-167.png"},{"idiom":"ios-marketing","scale":"1x","size":"1024x1024","filename":"icon-1024.png"}],"info":{"author":"xcode","version":1}}' > "$ICONSET/Contents.json"

            # ---- Push -------------------------------------------------
            #
            # Everything below has to happen here rather than in a committed
            # Xcode project, because there isn't one: this folder is thrown
            # away and rebuilt on every run. A GoogleService-Info.plist merely
            # copied into place is not enough — a file Xcode does not know
            # about is a file that never reaches the bundle, and
            # Firebase.initializeApp then fails at launch on a build that
            # compiled perfectly.
            if [ -f ../GoogleService-Info.plist ] || [ -f GoogleService-Info.plist ]; then
              cp GoogleService-Info.plist ios/Runner/GoogleService-Info.plist

              # aps-environment is what actually turns push on for a signed
              # build. 'production' because this workflow only ever produces
              # TestFlight and App Store builds — those talk to Apple's
              # production APNs servers, and a build entitled for the sandbox
              # silently receives nothing there.
              # printf rather than a heredoc, and this is not a style choice: a
              # heredoc body has to start at column 0 to keep the XML declaration
              # where the spec wants it, and a line at column 0 ends the YAML block
              # scalar this whole step lives in. The workflow then fails to parse at
              # all -- a zero-second run reporting a workflow file issue, with no
              # log to read and nothing about push in the message.
              {
                echo '<?xml version="1.0" encoding="UTF-8"?>'
                echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
                echo '<plist version="1.0">'
                echo '<dict>'
                echo '  <key>aps-environment</key>'
                echo '  <string>production</string>'
                echo '  <key>com.apple.developer.associated-domains</key>'
                echo '  <array>'
                echo '    <string>applinks:app.colabroom.com</string>'
                echo '  </array>'
                echo '</dict>'
                echo '</plist>'
              } > ios/Runner/Runner.entitlements

              # Apple, saying why it refused.
              #
              # firebase_messaging asks Apple for the APNs token itself at
              # plugin startup, and its own
              # didFailToRegisterForRemoteNotificationsWithError does nothing
              # but NSLog. So on 15 September 2026 a tester's iPhone reported
              # no token after thirty seconds with permission granted, and the
              # reason was readable only with the phone plugged into a Mac.
              #
              # Flutter declares both push callbacks on FlutterPlugin and
              # forwards them to anything registered with
              # addApplicationDelegate, so this needs no subclass of
              # FlutterAppDelegate and no override -- which matters, because
              # FlutterAppDelegate implements them without declaring them in
              # its header, and whether Swift then demands `override` is not
              # something anybody can test without a Mac.
              #
              # echo rather than a heredoc for the same reason as the
              # entitlements above: a heredoc terminator has to sit at column
              # 0, and a line at column 0 ends this YAML block scalar.
              {
                echo 'import Flutter'
                echo 'import UIKit'
                echo ''
                echo '// Registered by AppDelegate below. Holds the last thing'
                echo '// Apple said about registering this device for push, so'
                echo '// Dart can put it in a report instead of nobody seeing it.'
                echo 'public class ApnsWatcher: NSObject, FlutterPlugin {'
                echo '  private static var lastFailure: String?'
                echo '  private static var didRegister = false'
                echo ''
                echo '  public static func register(with registrar: FlutterPluginRegistrar) {'
                echo '    let instance = ApnsWatcher()'
                echo '    let channel = FlutterMethodChannel('
                echo '      name: "colabroom/apns",'
                echo '      binaryMessenger: registrar.messenger())'
                echo '    registrar.addMethodCallDelegate(instance, channel: channel)'
                echo '    registrar.addApplicationDelegate(instance)'
                echo '    // Ask Apple ourselves, on the main thread.'
                echo '    //'
                echo '    // firebase_messaging calls this too, and after two'
                echo '    // devices on three networks reported that Apple called'
                echo '    // back neither way, the assumption worth testing is that'
                echo '    // anybody asked at all. UIKit requires the main thread'
                echo '    // here and ignores the call from anywhere else, which'
                echo '    // looks exactly like Apple never answering. Asking twice'
                echo '    // is harmless; asking zero times is the bug.'
                echo '    DispatchQueue.main.async {'
                echo '      UIApplication.shared.registerForRemoteNotifications()'
                echo '    }'
                echo '  }'
                echo ''
                echo '  public func handle(_ call: FlutterMethodCall, result: @escaping FlutterResult) {'
                echo '    if call.method == "apnsState" {'
                echo '      // What UIKit itself believes, which is the one'
                echo '      // reading that does not depend on a callback arriving.'
                echo '      let osSays = UIApplication.shared.isRegisteredForRemoteNotifications'
                echo '      var state: [String: Any] = ['
                echo '        "registered": ApnsWatcher.didRegister,'
                echo '        "osRegistered": osSays,'
                echo '      ]'
                echo '      if let failure = ApnsWatcher.lastFailure {'
                echo '        state["failure"] = failure'
                echo '      }'
                echo '      result(state)'
                echo '      return'
                echo '    }'
                echo '    result(FlutterMethodNotImplemented)'
                echo '  }'
                echo ''
                echo '  // @objc is explicit rather than inferred. These satisfy'
                echo '  // optional requirements of an ObjC protocol, and a method'
                echo '  // that is not exposed to the runtime is simply never'
                echo '  // called, with nothing anywhere to say so -- which is the'
                echo '  // failure this whole class exists to end.'
                echo '  @objc public func application('
                echo '    _ application: UIApplication,'
                echo '    didFailToRegisterForRemoteNotificationsWithError error: Error'
                echo '  ) {'
                echo '    let problem = error as NSError'
                echo '    // The operator stays at the end of the line: a Swift'
                echo '    // continuation that begins with + parses as a prefix'
                echo '    // operator and does not compile.'
                echo '    ApnsWatcher.lastFailure = problem.domain + " " +'
                echo '      String(problem.code) + ": " + problem.localizedDescription'
                echo '  }'
                echo ''
                echo '  @objc public func application('
                echo '    _ application: UIApplication,'
                echo '    didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data'
                echo '  ) {'
                echo '    ApnsWatcher.didRegister = true'
                echo '  }'
                echo '}'
              } > ios/Runner/ApnsWatcher.swift

              # xcodeproj rather than sed. project.pbxproj is a generated
              # graph with its own object ids, and hand-editing it is how a
              # build starts failing in a way nobody can read.
              gem list -i xcodeproj > /dev/null 2>&1 || sudo gem install xcodeproj --no-document
              ruby -e '
                require "xcodeproj"
                project = Xcodeproj::Project.open("ios/Runner.xcodeproj")
                target = project.targets.find { |t| t.name == "Runner" }
                abort("::error::No Runner target") if target.nil?

                group = project.main_group["Runner"]
                unless group.files.any? { |f| f.path == "GoogleService-Info.plist" }
                  target.add_resources([group.new_reference("GoogleService-Info.plist")])
                end

                # A Swift file Xcode has not been told about is a file that
                # never compiles, in a build that otherwise succeeds -- the
                # same shape as the GoogleService-Info bug above.
                unless group.files.any? { |f| f.path == "ApnsWatcher.swift" }
                  target.add_file_references([group.new_reference("ApnsWatcher.swift")])
                end

                target.build_configurations.each do |config|
                  config.build_settings["CODE_SIGN_ENTITLEMENTS"] = "Runner/Runner.entitlements"
                end
                project.save
              '

              # The watcher only exists if something registers it, and
              # GeneratedPluginRegistrant only knows about pub packages.
              #
              # What it registers *with* is not a constant, which is why the
              # first version of this failed the build. Flutter 3.47 moved
              # registration out of didFinishLaunching and into
              # didInitializeImplicitFlutterEngine, where the registry is
              # `engineBridge.pluginRegistry` rather than `self`. Rather than
              # pick one and be wrong again the next time the template moves,
              # this reads whatever GeneratedPluginRegistrant was handed and
              # hands the watcher the same thing.
              ruby -e '
                path = "ios/Runner/AppDelegate.swift"
                src = File.read(path)
                found = src.match(/GeneratedPluginRegistrant\.register\(with: ([^)]+)\)/)
                if found.nil?
                  abort("::error::AppDelegate.swift registers no plugins in any form this patch recognises; the Flutter template has moved again")
                end
                unless src.include?("ApnsWatcher.register")
                  added = found[0] + "\n    if let registrar = " + found[1] + ".registrar(forPlugin: \"ApnsWatcher\") {\n      ApnsWatcher.register(with: registrar)\n    }"
                  File.write(path, src.sub(found[0], added))
                end
                puts "registered the APNs watcher with " + found[1]
              '
              grep -q "ApnsWatcher.register" ios/Runner/AppDelegate.swift \
                || { echo "::error::The APNs watcher was never registered, so Apple would keep refusing invisibly"; exit 1; }

              # A capability the provisioning profile does not carry is a
              # signing failure two minutes into an archive, with a message
              # about entitlements rather than about push. Say so plainly if
              # the file did not land.
              grep -q "CODE_SIGN_ENTITLEMENTS" ios/Runner.xcodeproj/project.pbxproj                 || { echo "::error::Push entitlement was not attached to the Runner target"; exit 1; }
            else
              echo "::warning::No GoogleService-Info.plist in the repo — this build will have no push."
            fi
          else
            echo "ios/ folder already present, using it as-is."
          fi

      - run: flutter pub get

      # flutter create doesn't ship a static ios/Podfile — Flutter generates
      # it lazily during an actual build step (and runs `pod install` as
      # part of that), not from `flutter pub get` alone. This unsigned
      # build is the same one the earlier validation run already proved
      # works; fastlane's build_app below does the real signed archive.
      - name: Generate Podfile and prime the iOS build
        # The dart-define belongs here rather than on fastlane's
        # build_app: this step is what compiles Dart into
        # App.framework, and xcodebuild only archives what it finds.
        run: flutter build ios --release --no-codesign --dart-define=BUILD_REF=${GITHUB_SHA::7}

      # Written fresh every run rather than committed — keeps the signing
      # pipeline entirely inside this workflow file, matching how the
      # scaffold step above isn't committed either.
      #
      # Several rounds of automatic-signing flag combinations (xcargs
      # DEVELOPMENT_TEAM/CODE_SIGN_STYLE/CODE_SIGN_IDENTITY overrides) kept
      # producing new conflicts, so signing moved to explicit manual mode
      # (update_code_signing_settings, Runner target only).
      #
      # Manual signing still needs a real cert+profile from somewhere. The
      # first attempt used `cert`/`sigh`, which mint a brand new Apple
      # Distribution certificate every run — but each GitHub-hosted runner
      # is thrown away afterward, so nothing ever gets reused, and Apple
      # caps how many active Distribution certs an account can have. Two
      # throwaway runs were enough to hit that cap outright ("reached the
      # maximum number of available Distribution certificates"), which
      # would recur on every single future run under that design, not just
      # this one. `match` fixes the actual problem: it generates the
      # cert+profile once, encrypts them with MATCH_PASSWORD, and pushes
      # them to a branch of this repo — every run after the first just
      # downloads and reuses that same pair instead of minting a new one.
      - name: Write Fastfile
        run: |
          mkdir -p ios/fastlane
          cat > ios/fastlane/Fastfile <<'EOF'
          default_platform(:ios)

          platform :ios do
            desc "Build and upload a TestFlight beta build"
            lane :beta do
              # Also used by match below as the keychain to import the
              # cert+key into (it defaults to whichever keychain setup_ci
              # just made the system default, so no explicit keychain_path
              # is needed here — that was the pitfall with the old `cert`
              # action).
              setup_ci

              api_key = app_store_connect_api_key(
                key_id: ENV["APPLE_API_KEY_ID"],
                issuer_id: ENV["APPLE_API_ISSUER_ID"],
                key_content: ENV["APPLE_API_KEY_P8"],
                is_key_content_base64: false
              )

              match(
                type: "appstore",
                api_key: api_key,
                app_identifier: "com.colabroom.beta",
                team_id: ENV["APPLE_TEAM_ID"],
                storage_mode: "git",
                git_url: "https://x-access-token:#{ENV['MATCH_GIT_TOKEN']}@github.com/#{ENV['MATCH_GIT_REPOSITORY']}.git",
                git_branch: "ios-signing-certs",
                readonly: false,
                force: ENV["NEW_SIGNING_PROFILE"] == "true"
              )

              # Apple rejects re-uploading a build number it's already seen,
              # and nothing else in this pipeline changes it between runs —
              # the GitHub Actions run number always increases, so tying the
              # build number to it guarantees every upload is new.
              increment_build_number(
                build_number: ENV["GITHUB_RUN_NUMBER"],
                xcodeproj: "Runner.xcodeproj"
              )

              update_code_signing_settings(
                use_automatic_signing: false,
                path: "Runner.xcodeproj",
                targets: ["Runner"],
                team_id: ENV["APPLE_TEAM_ID"],
                code_sign_identity: "Apple Distribution",
                profile_name: lane_context[SharedValues::MATCH_PROVISIONING_PROFILE_MAPPING]["com.colabroom.beta"]
              )

              build_app(
                workspace: "Runner.xcworkspace",
                scheme: "Runner",
                export_method: "app-store",
                output_directory: "build",
                output_name: "Runner.ipa"
              )

              upload_to_testflight(
                api_key: api_key,
                app_identifier: "com.colabroom.beta",
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOF

      - name: Build and upload to TestFlight
        run: cd ios && gem install fastlane -N && fastlane beta

      # Did the thing we signed actually carry push?
      #
      # 15 September 2026: a tester's iPhone reported "No APNs token after ten
      # seconds (permission authorized)" three times in one day, on the build
      # TestFlight was serving. Permission granted, and Apple still handed the
      # app no token. firebase_messaging calls
      # `registerForRemoteNotifications` itself at plugin startup, so "nobody
      # asked" is ruled out -- which leaves the request being *refused*, and
      # the plugin's `didFailToRegisterForRemoteNotificationsWithError` does
      # nothing but NSLog, so Apple's reason has never been visible to anybody
      # without the phone plugged into a Mac.
      #
      # The usual reason for a refusal is that the provisioning profile does
      # not carry `aps-environment`, whatever the entitlements file says. That
      # happens the moment Push Notifications is enabled on the App ID *after*
      # a profile was created: `match` stores the profile on a git branch and
      # reuses it forever, so the stale one keeps being signed in.
      #
      # This reads the two things that decide it, off the binary that was just
      # uploaded: the profile's own entitlements, and what the app is actually
      # signed with. Written down in the log either way, because the whole
      # cost of this bug has been nobody being able to see it.
      - name: Check the signed build really has push
        if: always()
        run: |
          set -u
          IPA=ios/build/Runner.ipa
          if [ ! -f "$IPA" ]; then
            echo "::warning::No IPA to inspect; the build did not get that far."
            exit 0
          fi
          WORK=$(mktemp -d)
          unzip -q "$IPA" -d "$WORK"
          APP=$(find "$WORK/Payload" -maxdepth 1 -name "*.app" | head -1)
          echo "app bundle: $(basename "$APP")"

          echo "--- what the app is signed with ---"
          codesign -d --entitlements :- "$APP" 2>/dev/null > "$WORK/signed.plist" || true
          plutil -p "$WORK/signed.plist" 2>/dev/null || cat "$WORK/signed.plist" || true

          echo "--- what the provisioning profile allows ---"
          security cms -D -i "$APP/embedded.mobileprovision" > "$WORK/profile.plist" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Print :Name" "$WORK/profile.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :ExpirationDate" "$WORK/profile.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :CreationDate" "$WORK/profile.plist" 2>/dev/null || true
          PROFILE_APS=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" "$WORK/profile.plist" 2>/dev/null || true)
          SIGNED_APS=$(grep -A1 "aps-environment" "$WORK/signed.plist" 2>/dev/null | tr -d ' \t\n' || true)

          echo "--- universal links ---"
          PROFILE_LINKS=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.associated-domains" "$WORK/profile.plist" 2>/dev/null || true)
          echo "profile associated-domains: ${PROFILE_LINKS:-ABSENT}"
          grep -q "applinks:app.colabroom.com" "$WORK/signed.plist" 2>/dev/null             && SIGNED_LINKS=yes || SIGNED_LINKS=no
          echo "signed with applinks:app.colabroom.com: $SIGNED_LINKS"
          /usr/libexec/PlistBuddy -c "Print :FlutterDeepLinkingEnabled" "$APP/Info.plist" 2>/dev/null             | sed 's/^/FlutterDeepLinkingEnabled: /' || echo "FlutterDeepLinkingEnabled: (unset, so true)"

          echo "--- background modes ---"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP/Info.plist" 2>/dev/null \
            || echo "(none -- a push cannot wake the app, so no receipt can be filed)"

          echo
          if [ -z "$PROFILE_LINKS" ] || [ "$SIGNED_LINKS" != yes ]; then
            echo "::error::This build cannot open app.colabroom.com links: the provisioning profile or the signed app has no associated domains. Switch on Associated Domains for the App ID com.colabroom.beta in the developer portal, then run this workflow once with new_signing_profile ticked. The build above is on TestFlight, and on it every scanned code opens Safari."
            LINKS_BROKEN=1
          fi
          if [ -z "$PROFILE_APS" ]; then
            echo "::error::The provisioning profile carries no aps-environment. This is why the phone gets no APNs token: iOS refuses registerForRemoteNotifications for a build whose profile does not allow push, however the entitlements file reads. Enable Push Notifications on the App ID com.colabroom.beta, then have match regenerate the profile (force: true once, or delete it from the ios-signing-certs branch). The build above is on TestFlight and will still not receive notifications."
            exit 1
          fi
          echo "profile aps-environment: $PROFILE_APS"
          case "$SIGNED_APS" in
            *production*) echo "signed aps-environment: production" ;;
            *development*) echo "::warning::Signed for the APNs sandbox while this workflow only makes TestFlight builds; a production push would reach nothing." ;;
            *) echo "::warning::Could not read the signed aps-environment; the profile allows push, so registration should work." ;;
          esac
          if [ -n "${LINKS_BROKEN:-}" ]; then exit 1; fi

# ---------------------------------------------------------------------------
# After this succeeds: the build shows up under App Store Connect ->
# TestFlight, usually within a few minutes to ~30 (Apple's own processing
# time, which this job doesn't wait for — skip_waiting_for_build_processing
# is set so the CI job itself finishes promptly). From there:
#   - Internal testers (people on your Apple Developer team, up to 100) get
#     it instantly once processing finishes, no review needed.
#   - External testers need one quick Apple Beta App Review the first time
#     (usually same-day to ~48h), then future builds skip review.
#
# Honest expectation-setting: this is the first real run of a from-scratch
# fastlane + API-key signing pipeline, and there's no way to test it without
# actually running it on GitHub's macOS runner — if it fails, the error in
# the Actions log (usually a signing or CocoaPods issue) is the next thing
# to look at, not a sign anything is fundamentally wrong with the approach.
#
# One-time setup this workflow depends on: a repo secret named
# MATCH_PASSWORD (any passphrase you pick — it's only used to encrypt the
# certificate before match stores it on the ios-signing-certs branch, never
# sent to Apple). GITHUB_TOKEN is provided automatically by Actions, no
# setup needed for that one.
# ---------------------------------------------------------------------------
