name: Seed or purge demo data

# Fills the project with seeded accounts, songs and audio so the app can be
# looked at with a crowd in it — or takes all of it away again.
#
# Manual only, and never on a schedule. It writes to the live project: every
# account it makes is real enough to appear in the Open Mic, and every clip it
# uploads is real storage. The flag is what makes that safe to undo, and the
# purge is what makes it safe to do at all.
#
# Everything it creates is drawn in the app with a DEMO chip. Seeding quietly
# would mislead the people already using this, and an App Store reviewer will
# open the same screens.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        type: choice
        required: true
        default: seed
        options:
          - seed
          - purge
      people:
        description: 'How many accounts to create (seed only)'
        type: string
        required: false
        default: '40'
      songs_each:
        description: 'Songs per account (seed only)'
        type: string
        required: false
        default: '3'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The clips are built here rather than committed: generated audio is
      # the only kind this repo can ship without a licence question.
      #
      # Installed rather than assumed. The first version of this step ran
      # `ffmpeg -version | head -1`, which reports the exit status of `head`
      # — so it passed cleanly on a runner with no ffmpeg at all, and the
      # failure surfaced one step later inside the tool.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
          ffmpeg -version | head -1

      - name: Seed
        if: ${{ inputs.action == 'seed' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python tools/seed_demo.py \
            --people "${{ inputs.people }}" \
            --songs-each "${{ inputs.songs_each }}"

      - name: Purge
        if: ${{ inputs.action == 'purge' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tools/seed_demo.py --purge
