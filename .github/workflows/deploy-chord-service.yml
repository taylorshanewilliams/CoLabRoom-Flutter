name: Deploy chord service to Cloud Run

# Manual only — this ships a real, billed Cloud Run revision every time it
# runs, unlike the build-only validation workflow.
on:
  workflow_dispatch:

env:
  PROJECT_ID: project-6541f949-af55-403f-aa1
  REGION: us-central1
  SERVICE_NAME: colabroom-chord-service
  REPO_NAME: colabroom-inference
  WORKLOAD_IDENTITY_PROVIDER: projects/776062206666/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: colabroom-deploy@project-6541f949-af55-403f-aa1.iam.gserviceaccount.com
  # The one credential this whole flow still needs as a real secret — see
  # inference/chord_service/app.py's require_api_key. Whatever calls
  # /analyze (the Phase 2 Edge Function) needs this same value.
  CHORD_SERVICE_API_KEY: ${{ secrets.CHORD_SERVICE_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # id-token: write is what lets this job mint the short-lived OIDC token
    # Workload Identity Federation exchanges for GCP credentials — no
    # downloadable service account key involved anywhere in this flow.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Create Artifact Registry repo if missing
        run: |
          gcloud artifacts repositories describe ${{ env.REPO_NAME }} \
            --location=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            || gcloud artifacts repositories create ${{ env.REPO_NAME }} \
                 --repository-format=docker \
                 --location=${{ env.REGION }} \
                 --project=${{ env.PROJECT_ID }} \
                 --description="CoLabRoom inference service images"

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" inference/chord_service
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          image: ${{ env.IMAGE }}
          env_vars: API_KEY=${{ env.CHORD_SERVICE_API_KEY }}
          flags: --allow-unauthenticated --memory=2Gi --timeout=300 --cpu=2

      - name: Print the service URL
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --format="value(status.url)"
