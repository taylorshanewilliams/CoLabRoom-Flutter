name: Build web

# Manual trigger, plus automatic builds on pushes to main so a fresh web
# build always exists to check against. Mirrors build-android-debug.yml.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-web.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm web/ has been bootstrapped
        run: |
          if [ ! -d web ]; then
            echo "::error::web/ doesn't exist. Run the 'Bootstrap web/ folder' workflow once first."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # No --dart-define here, deliberately: SUPABASE_URL/SUPABASE_ANON_KEY
      # aren't repo secrets (checked before writing this), and dart-define
      # with an empty value overrides beta_config.dart's default rather than
      # falling back to it — passing them empty would build a web app that
      # can't reach Supabase at all. Same as build-android-debug.yml, this
      # rides the checked-in defaults, which already point at the real beta
      # project.
      # Two flags the artifact needs before a browser can actually use it.
      #
      # --base-href, because this is served from colabroom.com/app/ rather
      # than a domain root. Without it every asset resolves against / and the
      # app loads a white page.
      #
      # AUTH_REDIRECT_URL, because beta_config.dart defaults it to
      # com.colabroom.beta://login-callback — a URI scheme a phone can open
      # and a desktop browser cannot. Signing in never used it
      # (signInWithPassword takes no redirect), which is why the build was
      # always closer to working than the note below claimed; but confirming
      # a new account and resetting a password both send an email pointing at
      # it, and on the web those links went nowhere.
      #
      # This URL must also be in the project's redirect allow-list in
      # Supabase, or the same links come back rejected instead of dead.
      - name: Build web
        run: |
          flutter build web --release \
            --base-href /app/ \
            --dart-define=AUTH_REDIRECT_URL=https://colabroom.com/app/

      - uses: actions/upload-artifact@v4
        with:
          name: colabroom-web
          path: build/web
          retention-days: 14

# ---------------------------------------------------------------------------
# Where this goes: the artifact is unzipped into colabroom-site under /app,
# which GitHub Pages serves at https://colabroom.com/app/. That is why
# --base-href is set, and why the auth redirect points there.
#
# To check a build locally instead: download the colabroom-web artifact,
# unzip it, and serve it with any static file server — `python3 -m
# http.server` from inside the folder. It will not run straight off the
# filesystem (file://) because of how Flutter web loads its assets, and with
# --base-href /app/ it wants to be served from an /app/ path.
#
# Still unverified in a browser: recording. The overdub path is
# latency-compensated native code and the web equivalent is a different
# problem. Playback, browsing, asking and signing in are the parts expected
# to work.
# ---------------------------------------------------------------------------
