name: Build web

# Manual trigger, plus automatic builds on pushes to main so a fresh web
# build always exists to check against. Mirrors build-android-debug.yml.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-web.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm web/ has been bootstrapped
        run: |
          if [ ! -d web ]; then
            echo "::error::web/ doesn't exist. Run the 'Bootstrap web/ folder' workflow once first."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # No --dart-define here, deliberately: SUPABASE_URL/SUPABASE_ANON_KEY
      # aren't repo secrets (checked before writing this), and dart-define
      # with an empty value overrides beta_config.dart's default rather than
      # falling back to it — passing them empty would build a web app that
      # can't reach Supabase at all. Same as build-android-debug.yml, this
      # rides the checked-in defaults, which already point at the real beta
      # project.
      # One flag the artifact needs before a browser can actually use it.
      #
      # AUTH_REDIRECT_URL, because beta_config.dart defaults it to
      # com.colabroom.beta://login-callback — a URI scheme a phone can open
      # and a desktop browser cannot. Signing in never used it
      # (signInWithPassword takes no redirect), which is why the build was
      # always closer to working than the note below claimed; but confirming
      # a new account and resetting a password both send an email pointing at
      # it, and on the web those links went nowhere.
      #
      # This URL must also be in the project's redirect allow-list in
      # Supabase, or the same links come back rejected instead of dead.
      #
      # No --base-href: this is served from the root of its own subdomain
      # rather than a path, so the default is right.
      - name: Build web
        run: |
          flutter build web --release \
            --dart-define=AUTH_REDIRECT_URL=https://app.colabroom.com/ \
            --dart-define=BUILD_REF=${GITHUB_SHA::7}

      # iPhones read this file (through Apple's CDN) before they will open
      # app.colabroom.com links in the app, and it has to name the app as
      # <Team ID>.<bundle id>. The Team ID is already a secret for the
      # TestFlight build, so it is filled in here rather than copied into
      # the repo by hand, where one wrong character would silently send
      # every link to Safari.
      - name: Name the iPhone app in the Universal Links file
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          FILE=build/web/.well-known/apple-app-site-association
          test -s "$FILE"
          if ! printf '%s' "$APPLE_TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::error::APPLE_TEAM_ID is missing or not a ten-character Team ID, so iPhones would not open links in the app."
            exit 1
          fi
          sed -i "s/__APPLE_TEAM_ID__/${APPLE_TEAM_ID}/" "$FILE"
          if grep -q "__APPLE_TEAM_ID__" "$FILE"; then
            echo "::error::The Team ID placeholder is still in $FILE."
            exit 1
          fi
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$FILE"

      # include-hidden-files: upload-artifact leaves out anything starting
      # with a dot, and .well-known/assetlinks.json is what lets Android open
      # app.colabroom.com links in the app. Without it the links still work,
      # in the browser, and nothing says why.
      - name: Check the App Links files made it into the build
        run: |
          test -s build/web/.well-known/assetlinks.json
          test -s build/web/.well-known/apple-app-site-association

      - uses: actions/upload-artifact@v4
        with:
          name: colabroom-web
          path: build/web
          include-hidden-files: true
          retention-days: 14

# ---------------------------------------------------------------------------
# Where this goes: app.colabroom.com, GitHub Pages, from its own repo —
# colabroom-app. Its own repo because the build is ~44MB of renderer
# binaries and that churn does not belong in the history of colabroom-site,
# which holds the legal pages. Its own subdomain because a root means no
# --base-href to keep in step.
#
# colabroom.com stays plain HTML. A 10MB first load is fine for an app
# somebody signs into and wrong for a shared song link, so public song pages
# and profiles belong there, not here.
#
# To check a build locally instead: download the colabroom-web artifact,
# unzip it, and serve it with any static file server — `python3 -m
# http.server` from inside the folder. It will not run straight off the
# filesystem (file://) because of how Flutter web loads its assets, and with
# --base-href /app/ it wants to be served from an /app/ path.
#
# Still unverified in a browser: recording. The overdub path is
# latency-compensated native code and the web equivalent is a different
# problem. Playback, browsing, asking and signing in are the parts expected
# to work.
# ---------------------------------------------------------------------------
