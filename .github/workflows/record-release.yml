name: Record the release

# The app announces itself — but only when somebody meant it to.
#
# The first version of this took every merge commit's title and showed it on
# Home to every person using CoLabRoom. That was wrong, and Taylor caught it
# on the day: "notifications in the app are very specific app notes,
# updating me on work we are doing on the app itself ... the app should only
# notify you about app related things, maybe feature updates, but not
# general app work."
#
# He is right. "One dropped connection" and "The expiry that never ran" are
# true sentences about this repository and mean nothing to somebody who came
# here to write a song. Most merges are plumbing, and plumbing is not news.
#
# So nothing is announced unless the commit carries a sentence written for a
# musician, in an `Announce:` block:
#
#     Announce: Talk to your band in the room
#     Every room has a thread now, and your people are one tap away on
#     Messages.
#
# The line after `Announce:` is the headline; the lines under it, up to the
# first blank line, are the sentence beneath it. No block, no announcement —
# which is the case for most of what gets merged, and should be.
#
# Nothing here is a push. These rows feed one card on Home (0121) and no
# notification of any kind.

on:
  push:
    branches: [main]

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Announce, if this commit asked to
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MESSAGE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          message = os.environ["MESSAGE"].replace("\r", "")
          lines = message.split("\n")

          headline = None
          body_lines = []
          for index, line in enumerate(lines):
              match = re.match(r"^\s*Announce:\s*(.+?)\s*$", line)
              if not match:
                  continue
              headline = match.group(1)
              for following in lines[index + 1:]:
                  if not following.strip():
                      break
                  body_lines.append(following.strip())
              break

          if not headline:
              print("No Announce: block — nothing to tell anybody about this one.")
              print("Most merges are plumbing, and plumbing is not news.")
              raise SystemExit(0)

          title = headline[:120]
          body = " ".join(body_lines)[:400]
          payload = json.dumps(
              {"sha": os.environ["SHA"], "title": title, "body": body}
          ).encode()
          url = f"https://{os.environ['PROJECT_REF']}.supabase.co/rest/v1/releases"
          request = urllib.request.Request(
              url,
              data=payload,
              method="POST",
              headers={
                  "apikey": os.environ["SERVICE_KEY"],
                  "Authorization": f"Bearer {os.environ['SERVICE_KEY']}",
                  "Content-Type": "application/json",
                  "Prefer": "resolution=ignore-duplicates",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(f"announced: {title} ({response.status})")
          except Exception as error:  # noqa: BLE001
              # A missing card is not a broken build.
              print(f"could not record the announcement: {error}")
          PY
