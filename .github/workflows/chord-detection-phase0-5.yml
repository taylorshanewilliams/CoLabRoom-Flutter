name: Chord detection Phase 0.5 validation

# One-off manual run: Demucs (source separation) -> ChordMini (chord
# detection), compared against the Phase 0 baseline (ChordMini alone).
# Test audio lives on the throwaway chord-detection-validation-v2 branch,
# not main — see project-chord-recognition-next-project memory for context.
# This file has to live on main for GitHub to allow dispatching it, but
# the actual checkout below still points at that side branch. Delete this
# file (and the side branch) once the comparison is done.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chord-detection-validation-v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone ChordMini
        run: git clone --depth 1 https://github.com/ptnghia-j/ChordMini.git

      - name: Install dependencies
        run: |
          pip install -r ChordMini/requirements.txt
          pip install demucs soundfile

      - name: Separate stems and build a harmonic-only mix per song
        # htdemucs splits each song into vocals/drums/bass/other. Chord
        # recognition wants the harmonic instruments, not the vocal melody
        # or the drum transients competing for the model's attention, so
        # bass+other (dropping vocals and drums) is the mix fed to
        # ChordMini next — a standard choice for separation-then-chord
        # pipelines, not something ChordMini's own docs prescribe (it was
        # built for full-mix input), so this is the one judgment call in
        # this workflow worth flagging if the comparison looks off.
        run: |
          mkdir -p chord_validation/harmonic_mix
          for f in chord_validation/samples/*.mp3; do
            name=$(basename "$f" .mp3)
            python -m demucs -n htdemucs -o chord_validation/separated "$f"
            python - "$name" <<'PYEOF'
          import sys, soundfile as sf
          name = sys.argv[1]
          base = f"chord_validation/separated/htdemucs/{name}"
          bass, sr = sf.read(f"{base}/bass.wav")
          other, _ = sf.read(f"{base}/other.wav")
          mix = bass + other
          sf.write(f"chord_validation/harmonic_mix/{name}.wav", mix, sr)
          PYEOF
          done

      - name: Run ChordNet inference on each harmonic mix
        run: |
          mkdir -p chord_validation/results_05
          cd ChordMini
          for f in ../chord_validation/harmonic_mix/*.wav; do
            name=$(basename "$f" .wav)
            mkdir -p "../chord_validation/results_05/$name"
            echo "::group::$name"
            python src/evaluation/test.py \
              --model_type ChordNet \
              --checkpoint checkpoints/2e1d_model_best.pth \
              --config config/ChordMini.yaml \
              --audio_dir "$f" \
              --save_dir "../chord_validation/results_05/$name" \
              --use_overlap \
              --use_gaussian \
              --kernel_size 9 \
              --vote_aggregation logit \
              --min_segment_duration 0.5 \
              --smooth_predictions \
              2>&1 | tee "../chord_validation/results_05/${name}.log"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: chord-validation-results-05
          path: chord_validation/results_05
          retention-days: 7
