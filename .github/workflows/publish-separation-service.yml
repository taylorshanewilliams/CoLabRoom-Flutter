name: Publish separation service image

# Builds inference/separation_service and pushes it to GitHub Container
# Registry so RunPod's Serverless endpoint has something to pull. Manual
# only — this is a large image (CUDA + PyTorch + Demucs), no reason to
# rebuild it on every push.
on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/colabroom-separation-service

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: inference/separation_service
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Print image reference
        run: echo "Pushed ${{ env.IMAGE }}:latest — RunPod's endpoint should point at this."
