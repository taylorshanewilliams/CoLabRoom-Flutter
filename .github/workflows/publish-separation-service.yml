name: Publish separation service image

# Builds inference/separation_service, pushes it to GitHub Container
# Registry, then tells RunPod's Serverless endpoint to roll its workers
# onto the new image. Runs automatically on every push that touches the
# service, so a merged fix is live within a few minutes instead of
# depending on someone remembering to redeploy by hand.
on:
  push:
    branches: [main]
    paths:
      - 'inference/separation_service/**'
      - '.github/workflows/publish-separation-service.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/colabroom-separation-service

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # To ask the health check for the proof, below.
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built locally first and only pushed after the smoke test passes.
      # Publishing an image that can't complete a job means RunPod rolls onto
      # it and every analysis silently falls back to the on-device heuristic
      # — which is how a broken ffmpeg filter reached real users.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: inference/separation_service
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}

      - name: Smoke test the image
        run: |
          docker run --rm --network host \
            ${{ env.IMAGE }}:${{ github.sha }} \
            python -u /app/smoke_test.py

      - name: Push
        run: |
          docker tag ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Roll RunPod workers onto the new image
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
        run: |
          # Deploying a fresh image to GHCR doesn't do anything on its own —
          # RunPod's existing workers keep running whatever image they last
          # pulled until the endpoint cuts a new release. Two steps, and both
          # are needed: PATCHing the template's imageName says what the next
          # release should run, and PATCHing the endpoint (re-asserting its
          # own templateId) is what actually cuts that release — new workers
          # pull the image, old ones drain. For three weeks this step did only
          # the first, and the workers stayed on the image from August while
          # every log said they had rolled. The endpoint's version number
          # moving is the proof, and this step fails if it does not.
          if [ -z "$RUNPOD_API_KEY" ] || [ -z "$RUNPOD_ENDPOINT_ID" ]; then
            echo "::warning::RUNPOD_API_KEY or RUNPOD_ENDPOINT_ID repo secret is not set — the image was pushed to GHCR but RunPod was NOT told to redeploy. Add both secrets under Settings > Secrets and variables > Actions to enable auto-rollout."
            exit 0
          fi

          endpoint=$(curl -sf -H "Authorization: Bearer $RUNPOD_API_KEY" \
            "https://rest.runpod.io/v1/endpoints/$RUNPOD_ENDPOINT_ID")
          template_id=$(echo "$endpoint" | jq -r '.templateId')
          version_before=$(echo "$endpoint" | jq -r '.version')

          if [ -z "$template_id" ] || [ "$template_id" = "null" ]; then
            echo "::error::Could not resolve a templateId for RunPod endpoint $RUNPOD_ENDPOINT_ID — check RUNPOD_ENDPOINT_ID is correct."
            exit 1
          fi

          curl -sf -X PATCH "https://rest.runpod.io/v1/templates/$template_id" \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"imageName\": \"${{ env.IMAGE }}:${{ github.sha }}\"}" > /dev/null
          echo "Template $template_id now names ${{ env.IMAGE }}:${{ github.sha }}."

          # RunPod ignores a PATCH that changes nothing (re-asserting the same
          # templateId left version 23 at 23), and the template's image is not
          # a field of the endpoint. So the one field that costs nothing to
          # move is moved and put back: the idle timeout, by a second. Each
          # PATCH cuts a release on the template's current image; the second
          # is the one that stays, with the settings exactly as found.
          idle=$(echo "$endpoint" | jq -r '.idleTimeout')
          case "$idle" in ''|null|*[!0-9]*)
            echo "::error::The endpoint has no integer idleTimeout to nudge (got '$idle')."
            exit 1;;
          esac
          for value in $((idle + 1)) "$idle"; do
            curl -sf -X PATCH "https://rest.runpod.io/v1/endpoints/$RUNPOD_ENDPOINT_ID" \
              -H "Authorization: Bearer $RUNPOD_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"idleTimeout\": $value}" > /dev/null
          done

          version_after=$(curl -sf -H "Authorization: Bearer $RUNPOD_API_KEY" \
            "https://rest.runpod.io/v1/endpoints/$RUNPOD_ENDPOINT_ID" | jq -r '.version')

          # The version number is a hint, not the proof. On 14 Sep 2026 it
          # stayed at 28 through the nudge and the workers were on the new
          # image anyway; the proof is a job answering with this commit,
          # which the health check asks for in the next step.
          if [ "$version_after" = "$version_before" ]; then
            echo "::warning::The endpoint's release version did not move ($version_before). That has happened with the workers on the new image regardless — the health check dispatched next says which build actually answers."
          else
            echo "Endpoint release cut: version $version_before -> $version_after. New workers pull the image above; old ones drain."
          fi

      - name: Ask a worker which build it is
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The only proof of a rollout is a worker saying it was built from
          # this commit. The health check submits a real job and fails when
          # the answer names a different build than the template does.
          gh workflow run health-check.yml -f depth=quick
          echo "Dispatched health-check.yml (quick). Its log prints 'worker build: ${GITHUB_SHA:0:12}' when the rollout has reached the workers."
