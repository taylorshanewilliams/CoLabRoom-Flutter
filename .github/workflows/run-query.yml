name: Ask the database a question

# Runs one read-only SQL query against the project and prints the result.
#
# Manual only. Read-only is enforced by Postgres — the statement runs in a
# transaction marked READ ONLY, so any write fails and rolls back — rather
# than by inspecting the query text.
#
# Results land in this log. Ask for facts, not personal data: counts,
# booleans, masked identifiers. The `invite-lookup` preset below is the
# shape to copy.
on:
  workflow_dispatch:
    inputs:
      preset:
        description: 'A saved diagnostic, or "custom" to use the sql input'
        type: choice
        required: true
        default: invite-lookup
        options:
          - invite-lookup
          - usage-by-month
          - usage-per-analysis
          - storage-footprint
          - who-pays-per-room
          - custom
      sql:
        description: 'SQL to run when preset is "custom" (single statement, read-only)'
        type: string
        required: false

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the query
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PRESET: ${{ inputs.preset }}
          CUSTOM_SQL: ${{ inputs.sql }}
        run: |
          if [ "$PRESET" = "invite-lookup" ]; then
            # Why every pending invite reported "no account yet". Emails are
            # masked to first two characters plus domain — enough to tell one
            # invite from another, not enough to be a mailing list.
            cat > /tmp/query.sql <<'SQL'
          select
            left(i.email, 2) || '***@' || split_part(i.email, '@', 2) as invited,
            i.status,
            i.created_at,
            exists (
              select 1 from auth.users u where lower(u.email) = lower(i.email)
            ) as exact_match,
            exists (
              select 1 from auth.users u where lower(trim(u.email)) = lower(trim(i.email))
            ) as trimmed_match,
            (
              select count(*) from auth.users u
              where lower(split_part(u.email, '@', 2)) = lower(split_part(i.email, '@', 2))
            ) as accounts_on_that_domain,
            (select count(*) from auth.users) as total_accounts,
            (
              select count(*) from public.notifications n
              where n.invitation_id = i.id
            ) as notifications_sent
          from public.invitations i
          order by i.created_at desc
          limit 20;
          SQL
          elif [ "$PRESET" = "usage-by-month" ]; then
            # What each account consumed. Accounts are masked to a short id —
            # this answers "what does a user cost", not "who is this".
            cat > /tmp/query.sql <<'SQL'
          select
            left(account_id::text, 8) as account,
            to_char(month, 'YYYY-MM') as month,
            separations_run,
            separations_from_cache,
            transcriptions_run,
            round(gpu_ms / 1000.0, 1) as gpu_seconds,
            round(chord_service_ms / 1000.0, 1) as chord_seconds,
            round(whisper_audio_ms / 60000.0, 1) as whisper_minutes,
            round(bytes_added / 1048576.0, 1) as mb_added
          from public.usage_by_account_month
          order by month desc, gpu_ms desc
          limit 40;
          SQL
          elif [ "$PRESET" = "usage-per-analysis" ]; then
            # The unit cost question: what does ONE analysis consume? Median
            # rather than mean, so one enormous file doesn't set your price.
            cat > /tmp/query.sql <<'SQL'
          select
            count(*) filter (where service = 'separation' and not cached) as real_separations,
            count(*) filter (where service = 'separation' and cached) as cache_hits,
            round(
              100.0 * count(*) filter (where service = 'separation' and cached)
              / nullif(count(*) filter (where service = 'separation'), 0), 1
            ) as cache_hit_percent,
            round((percentile_cont(0.5) within group (
              order by compute_ms
            ) filter (where service = 'separation' and not cached))::numeric / 1000.0, 1) as median_gpu_seconds,
            round((percentile_cont(0.5) within group (
              order by audio_ms
            ) filter (where service = 'separation'))::numeric / 60000.0, 2) as median_song_minutes,
            round((percentile_cont(0.5) within group (
              order by bytes
            ) filter (where service = 'storage'))::numeric / 1048576.0, 1) as median_mb_per_song,
            round(sum(bytes) filter (where service = 'storage') / 1073741824.0, 3) as total_gb_stored
          from public.usage_events;
          SQL
          elif [ "$PRESET" = "storage-footprint" ]; then
            # What is being stored, how old it is, and what it would cost to
            # keep for a year. Reads storage.objects directly, so it reflects
            # everything ever written — including anything the app forgot to
            # clean up. This is the input to the retention decision.
            cat > /tmp/query.sql <<'SQL'
          select
            o.bucket_id as bucket,
            case
              when o.name like '%/stems/%' then 'separated stems'
              when o.name like '%/analysis/%' then 'reference recordings'
              else 'other'
            end as kind,
            count(*) as objects,
            round(sum((o.metadata->>'size')::bigint) / 1048576.0, 1) as total_mb,
            round(avg((o.metadata->>'size')::bigint) / 1048576.0, 2) as avg_mb,
            min(o.created_at)::date as oldest,
            count(*) filter (where o.created_at < now() - interval '90 days') as older_than_90d,
            round(
              sum((o.metadata->>'size')::bigint) filter (
                where o.created_at < now() - interval '90 days'
              ) / 1048576.0, 1
            ) as reclaimable_mb_at_90d
          from storage.objects o
          group by o.bucket_id, 2
          order by total_mb desc;
          SQL
          elif [ "$PRESET" = "who-pays-per-room" ]; then
            # Individual plans or a band plan? The question turns on how many
            # people in a room actually run analyses that cost money, as
            # opposed to reading results, which costs nothing.
            #
            # If it is reliably one, individual plans capture nearly all the
            # value and a band plan is a discount nobody asked for. If it is
            # three or four, a band plan is money left on the table. This
            # answers it with data instead of instinct.
            cat > /tmp/query.sql <<'SQL'
          with paid_work as (
            select distinct p.room_id, e.account_id
            from public.usage_events e
            join public.projects p on p.id = e.project_id
            where e.service = 'separation' and not e.cached
          )
          select
            left(r.id::text, 8) as room,
            r.name,
            (select count(*) from public.room_members m where m.room_id = r.id) as members,
            (select count(*) from paid_work w where w.room_id = r.id) as members_who_analyze,
            (
              select count(*) from public.usage_events e2
              join public.projects p2 on p2.id = e2.project_id
              where p2.room_id = r.id and e2.service = 'separation' and not e2.cached
            ) as analyses_paid_for,
            (
              select count(*) from public.usage_events e3
              join public.projects p3 on p3.id = e3.project_id
              where p3.room_id = r.id and e3.service = 'separation' and e3.cached
            ) as analyses_from_cache
          from public.rooms r
          order by analyses_paid_for desc
          limit 30;
          SQL
          else
            printf '%s' "$CUSTOM_SQL" > /tmp/query.sql
          fi
          python tools/run_query.py "$(cat /tmp/query.sql)"
