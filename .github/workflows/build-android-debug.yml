name: Build Android debug APK

# Manual trigger, plus automatic builds on pushes to main so you always have
# a fresh debug APK to install without asking for one.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-android-debug.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pin this to a specific version (e.g. flutter-version: '3.27.1')
          # once you've confirmed a build that works well, so upgrades to
          # the "stable" channel can't unexpectedly change your build.
          cache: true

      # This repo, as currently exported, has no android/ folder. If your
      # real project already has one (likely, since this app has shipped
      # betas before), that folder takes precedence and this step no-ops.
      # If android/ truly doesn't exist yet, this scaffolds a bare one —
      # see the note at the bottom of this file about permissions you'll
      # then need to add by hand before recording/import features work.
      - name: Scaffold Android platform folder if missing
        run: |
          if [ ! -d android ]; then
            echo "No android/ folder found — scaffolding one."
            flutter create --platforms=android --org com.colabroom --project-name colabroom .
            # whisper_ggml's native module requires a newer side-by-side NDK
            # than the one flutter.ndkVersion resolves to on this Flutter
            # version; pin the higher version the plugin needs (NDK is
            # backward compatible, so this doesn't affect other plugins).
            sed -i -E 's/^(\s*)ndkVersion = .*/\1ndkVersion = "29.0.13113456"/' android/app/build.gradle.kts
            # ffmpeg_kit_flutter_new_min (pulled in transitively by
            # whisper_ggml's bundled FFmpeg conversion) requires compiling
            # against API 35+; flutter.compileSdkVersion resolves lower on
            # this Flutter version.
            sed -i -E 's/^(\s*)compileSdk = .*/\1compileSdk = 36/' android/app/build.gradle.kts
            grep -q 'ndkVersion = "29.0.13113456"' android/app/build.gradle.kts || { echo "::error::ndkVersion patch did not apply"; exit 1; }
            grep -q 'compileSdk = 36' android/app/build.gradle.kts || { echo "::error::compileSdk patch did not apply"; exit 1; }
            # whisper_ggml's own Gradle module (fetched from pub cache, not
            # ours to edit) hardcodes compileSdk 34 independently of the
            # app's setting, which is too low for its ffmpeg_kit_flutter_new_min
            # dependency. Force every plugin subproject's compileSdk from the
            # root build script instead — the standard fix for AAR metadata
            # errors caused by a plugin's own compileSdk being stuck too low.
            {
              echo ''
              echo 'subprojects {'
              echo '    afterEvaluate {'
              echo '        extensions.findByType(com.android.build.gradle.BaseExtension::class.java)?.let { android ->'
              echo '            android.compileSdkVersion(36)'
              echo '        }'
              echo '    }'
              echo '}'
            } >> android/build.gradle.kts
          else
            echo "android/ folder already present, using it as-is."
          fi

      - run: flutter pub get

      # whisper_ggml's Gradle module configures a side-by-side NDK version
      # that isn't pre-licensed on the runner's Android SDK image, which
      # fails the build with LicenceNotAcceptedException before compilation
      # even starts. Accept all licenses up front.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: colabroom-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

# ---------------------------------------------------------------------------
# After the run finishes: open the workflow run on GitHub, scroll to
# "Artifacts", and download colabroom-debug-apk.zip — it contains
# app-debug.apk. Debug builds aren't signed for release and install fine
# via `adb install` or by sideloading directly on a test device (you'll
# need "install unknown apps" enabled for whatever app you use to open it).
#
# If this workflow had to scaffold android/ for you (check the build log
# for "scaffolding one"), add these to android/app/src/main/AndroidManifest.xml
# before testing recording/import, or those features will silently fail:
#   <uses-permission android:name="android.permission.RECORD_AUDIO" />
#   <uses-permission android:name="android.permission.INTERNET" />
# and confirm applicationId in android/app/build.gradle matches the
# authRedirectUrl scheme in lib/app/beta_config.dart (currently
# com.colabroom.beta) so Supabase auth deep links resolve correctly.
# ---------------------------------------------------------------------------
