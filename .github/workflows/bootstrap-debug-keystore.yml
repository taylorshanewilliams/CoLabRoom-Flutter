name: Bootstrap stable debug keystore

# One-time (re-runnable, but idempotent) manual job: generates a debug
# signing keystore and commits it, then points android/app/build.gradle.kts
# at it explicitly. Without this, every CI run signs the debug APK with a
# freshly auto-generated key (GitHub Actions runners are ephemeral, so
# there's no persisted ~/.android/debug.keystore between runs), and Android
# refuses to install an update over an app signed with a different
# certificate — forcing an uninstall before every single new build. This
# keystore uses the same well-known alias/password Android's own default
# debug keystore always uses (androiddebugkey / android) — it is not a
# secret, just a fixed identity so every build matches.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore if missing
        run: |
          if [ -f android/app/debug.keystore ]; then
            echo "android/app/debug.keystore already exists — nothing to do."
            echo "SHOULD_COMMIT=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "SHOULD_COMMIT=true" >> "$GITHUB_ENV"

          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # android/.gitignore blanket-excludes **/*.keystore (correct for
          # real release keys) — carve out this specific, non-secret file.
          if ! grep -qF '!app/debug.keystore' android/.gitignore; then
            echo '!app/debug.keystore' >> android/.gitignore
          fi

          if ! grep -q 'storeFile' android/app/build.gradle.kts; then
            {
              echo ''
              echo '    signingConfigs {'
              echo '        getByName("debug") {'
              echo '            storeFile = file("debug.keystore")'
              echo '            storePassword = "android"'
              echo '            keyAlias = "androiddebugkey"'
              echo '            keyPassword = "android"'
              echo '        }'
              echo '    }'
            } > /tmp/signing_block.txt
            awk '
              /^[[:space:]]*buildTypes[[:space:]]*\{/ && !done {
                while ((getline line < "/tmp/signing_block.txt") > 0) print line
                done = 1
              }
              { print }
            ' android/app/build.gradle.kts > /tmp/build.gradle.kts.new
            mv /tmp/build.gradle.kts.new android/app/build.gradle.kts
          fi

          grep -q 'storeFile' android/app/build.gradle.kts || { echo "::error::signingConfigs insert did not apply"; exit 1; }
          echo "--- android/app/build.gradle.kts after patching ---"
          cat android/app/build.gradle.kts

      - name: Commit and push
        if: env.SHOULD_COMMIT == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f android/app/debug.keystore
          git add android/.gitignore android/app/build.gradle.kts
          git commit -m "Bootstrap a stable debug signing keystore"
          git push
