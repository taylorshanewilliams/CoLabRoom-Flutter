name: Expire old separated stems

# Manual only, for now — deliberately not on a schedule yet. This is a new
# deletion path; run it by hand a few times (dry run first) before trusting
# it to a cron. Once it's been watched succeed a few times, add a `schedule:`
# trigger here (weekly is plenty, given the economics — see expire_stems.py).
on:
  # Sundays, twenty minutes after the layers sweep. It was left on
  # workflow_dispatch "until it has been watched succeed a few times", and
  # nobody watched -- so nobody noticed it had been dying on a table that
  # migration 0066 dropped, and the stems it exists to expire were never
  # swept at all. It has now run clean, with nothing old enough to remove,
  # which is the safest moment there will ever be to turn it on: the first
  # scheduled run is a no-op too.
  schedule:
    - cron: '40 4 * * 0'
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Stems older than this many days expire'
        type: string
        default: '90'
      dry_run:
        description: 'true = report only, false = actually delete'
        type: choice
        options: ['true', 'false']
        default: 'true'

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Expire stems
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # A scheduled run has no inputs, so both need a default or the
          # sweep would run with an empty retention and never delete.
          RETENTION_DAYS: ${{ inputs.retention_days || '90' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python tools/expire_stems.py
