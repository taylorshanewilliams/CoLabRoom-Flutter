name: DEBUG scaffold inspection

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold and inspect res/
        run: |
          flutter create --platforms=android --org com.colabroom --project-name colabroom .
          echo "--- res/ tree ---"
          find android/app/src/main/res -type f | sort
          echo "--- mipmap-anydpi-v26/ic_launcher.xml (if present) ---"
          cat android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml 2>/dev/null || echo "(not present)"
          echo "--- mipmap-anydpi-v26/ic_launcher_round.xml (if present) ---"
          cat android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml 2>/dev/null || echo "(not present)"
          echo "--- values/ic_launcher_background.xml (if present) ---"
          cat android/app/src/main/res/values/ic_launcher_background.xml 2>/dev/null || echo "(not present)"
          echo "--- grep for ic_launcher_background anywhere in res/values ---"
          grep -rn "ic_launcher_background" android/app/src/main/res/values/ 2>/dev/null || echo "(no match)"
          echo "--- AndroidManifest.xml ---"
          cat android/app/src/main/AndroidManifest.xml
          echo "--- app/build.gradle.kts applicationId line ---"
          grep -n "applicationId" android/app/build.gradle.kts
          echo "--- which rsvg-convert / imagemagick ---"
          which rsvg-convert || echo "rsvg-convert not found"
          which convert || echo "imagemagick convert not found"
          which magick || echo "magick not found"
