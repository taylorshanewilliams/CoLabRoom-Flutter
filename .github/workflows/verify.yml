name: Verify

# Static checks for the parts of this repo the Flutter build never touches.
#
# The Android build already type-checks every line of Dart, but the Edge
# Functions and the Python services were only ever validated by deploying
# them and seeing what happened. Both of the last two production failures
# lived in that gap.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # The APK build compiles the app but never ran the test suite, so the
      # tests in test/ have been decorative. Analyze also catches the things
      # a build tolerates — unused imports, dead code, missing awaits.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Supabase bundles functions with esbuild, which strips types without
      # checking them — a type error deploys perfectly happily and only shows
      # up at runtime. This is the check that deploy doesn't do.
      - name: Type-check Edge Functions
        run: deno check supabase/functions/*/index.ts

  database:
    runs-on: ubuntu-latest

    # Nothing else in this repo ever executes a migration. `flutter analyze`
    # cannot see SQL, and the apply workflow runs one file straight at
    # production — so until now the first thing to run a trigger body was a
    # musician typing a lyric. That is where `min(uuid)` was found.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: colabroom_smoke
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: colabroom_smoke
      # Anything the server merely grumbles about is not worth failing on, but
      # a raised exception must stop the job at the file that raised it.
      PSQL: psql --no-psqlrc --quiet -v ON_ERROR_STOP=1

    steps:
      - uses: actions/checkout@v5

      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Stand up the Supabase-shaped bits Postgres does not ship with
        run: $PSQL -f supabase/smoke/00_shim.sql

      # In filename order, which is the order they were applied in production.
      # A migration that only works because of something a human did in the
      # dashboard fails here, and should.
      - name: Replay every migration
        run: |
          for file in supabase/migrations/*.sql; do
            echo "--- $file"
            $PSQL -f "$file"
          done

      - name: Write a song
        run: $PSQL -f supabase/smoke/10_scenario.sql

      - name: Check every trigger is accounted for
        run: $PSQL -f supabase/smoke/20_trigger_coverage.sql

  python-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse every workflow file
        # A workflow whose YAML is invalid does not fail loudly — it fails in
        # zero seconds with "this run likely failed because of a workflow file
        # issue", no log, and no clue which line. build-ios-testflight.yml
        # spent a merge and every subsequent push to main in that state,
        # because a heredoc body sat at column 0 and column 0 ends the block
        # scalar the whole step lives in.
        #
        # Nothing else in this repo reads these files until GitHub does, by
        # which point the branch is already merged. Two seconds here closes
        # that gap for all of them.
        run: |
          python - <<'CHECK'
          import glob, sys, yaml
          broken = []
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(path, encoding='utf-8'))
              except Exception as error:
                  broken.append((path, str(error).splitlines()[0]))
          for path, reason in broken:
              print(f"::error file={path}::{reason}")
          print(f"{len(glob.glob('.github/workflows/*.yml'))} workflows checked, {len(broken)} broken")
          sys.exit(1 if broken else 0)
          CHECK

      - name: Compile-check Python
        run: |
          python -m compileall -q \
            tools/set_push_config.py \
            inference/separation_service/handler.py \
            inference/separation_service/smoke_test.py \
            inference/chord_service/app.py \
            tools/apply_migration.py \
            tools/run_query.py \
            tools/health_check.py \
            tools/load_test.py \
            tools/expire_stems.py \
            tools/chord_mix_experiment.py \
            tools/transcript_mix_experiment.py \
            tools/transcript_model_experiment.py \
            tools/lyric_accuracy_experiment.py \
            tools/triage_agent/triage.py

      - name: Lint
        run: |
          pip install --quiet ruff
          # Errors and undefined names only. A style opinion failing the build
          # would just train people to ignore this job.
          ruff check --select E9,F63,F7,F82,F821 \
            inference tools
