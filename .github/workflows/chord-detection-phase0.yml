name: Chord detection Phase 0 validation

# One-off manual run to compare ChordMini's chord detection against the
# current on-device heuristic, using real band recordings that live on the
# throwaway chord-detection-validation branch (not main — see
# project-chord-recognition-next-project memory for context). This file
# has to live on main for GitHub to let it be dispatched at all, but the
# actual checkout below still points at that side branch for the audio.
# Delete this file (and the side branch) once the comparison is done.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chord-detection-validation

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone ChordMini
        run: git clone --depth 1 https://github.com/ptnghia-j/ChordMini.git

      - name: Install dependencies
        run: pip install -r ChordMini/requirements.txt

      - name: Run ChordNet inference on each sample
        run: |
          mkdir -p chord_validation/results
          cd ChordMini
          for f in ../chord_validation/samples/*.mp3; do
            name=$(basename "$f" .mp3)
            mkdir -p "../chord_validation/results/$name"
            echo "::group::$name"
            python src/evaluation/test.py \
              --model_type ChordNet \
              --checkpoint checkpoints/2e1d_model_best.pth \
              --config config/ChordMini.yaml \
              --audio_dir "$f" \
              --save_dir "../chord_validation/results/$name" \
              --use_overlap \
              --use_gaussian \
              --kernel_size 9 \
              --vote_aggregation logit \
              --min_segment_duration 0.5 \
              --smooth_predictions \
              2>&1 | tee "../chord_validation/results/${name}.log"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: chord-validation-results
          path: chord_validation/results
          retention-days: 7
